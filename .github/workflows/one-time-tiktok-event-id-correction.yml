name: One-time TikTok event ID correction

on:
  push:
    branches: [fix/tiktok-catalog-variant-schema-matching]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tiktok-event-corrected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tiktok-catalog-variant-schema-matching
          fetch-depth: 0

      - name: Correct event ID separation
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/app/checkout/page.js')
          t = p.read_text(encoding='utf-8')

          # InitiateCheckout: Meta keeps its original getCatalogId; TikTok gets its SKU.
          fb_old = '''fbTrack("InitiateCheckout", {\n      value: finalTotal,\n      currency: "EGP",\n      num_items: cartItems.reduce((s, it) => s + it.qty, 0),\n      // 🔥 نفس getCatalogId المستخدَمة في الكتالوج و ProductView.js — كل\n      // عنصر في السلة يحمل selectedColor بالفعل (مخزَّن من addToCart)،\n      // فنستخدمه لتوليد نفس g:id الخاص بلونه بالضبط.\n      content_ids: cartItems\n        .filter(it => it.handle || it.id)\n        .map(it => getTikTokSkuIdForItem(it)),\n    });'''
          fb_new = '''fbTrack("InitiateCheckout", {\n      value: finalTotal,\n      currency: "EGP",\n      num_items: cartItems.reduce((s, it) => s + it.qty, 0),\n      // Meta Catalog ID — لا يتغير.\n      content_ids: cartItems\n        .filter(it => it.handle || it.id)\n        .map(it => getCatalogId(it.handle || it.id, it.selectedColor)),\n    });'''
          if fb_old not in t:
              raise SystemExit('Checkout Meta InitiateCheckout block not found')
          t = t.replace(fb_old, fb_new, 1)

          tt_old = '''ttTrack("InitiateCheckout", {\n      value: finalTotal,\n      currency: "EGP",\n      num_items: cartItems.reduce((s, it) => s + it.qty, 0),\n      content_ids: cartItems\n        .filter(it => it.handle || it.id)\n        .map(it => getCatalogId(it.handle || it.id, it.selectedColor)),\n    });'''
          tt_new = '''ttTrack("InitiateCheckout", {\n      value: finalTotal,\n      currency: "EGP",\n      num_items: cartItems.reduce((s, it) => s + it.qty, 0),\n      content_ids: cartItems\n        .filter(it => it.handle || it.id)\n        .map(it => getTikTokSkuIdForItem(it)),\n    });'''
          if tt_old not in t:
              raise SystemExit('Checkout TikTok InitiateCheckout block not found')
          t = t.replace(tt_old, tt_new, 1)

          # Purchase: preserve the existing Meta purchaseContentIds and create a
          # separate TikTok array from the exact same cart snapshot.
          purchase_old = '''        const purchaseNumItems = cartItems.reduce((s, it) => s + it.qty, 0);\n        const purchaseCartSnapshot = cartItems.map(it => ({'''
          purchase_new = '''        const purchaseTikTokContentIds = cartItems\n          .filter(it => it.handle || it.id)\n          .map(it => getTikTokSkuIdForItem(it));\n        const purchaseNumItems = cartItems.reduce((s, it) => s + it.qty, 0);\n        const purchaseCartSnapshot = cartItems.map(it => ({'''
          if purchase_old not in t:
              raise SystemExit('Checkout purchase insertion point not found')
          t = t.replace(purchase_old, purchase_new, 1)

          tt_purchase_old = '''        ttTrack("CompletePayment", {\n          value: finalTotal,\n          currency: "EGP",\n          content_ids: purchaseContentIds,'''
          tt_purchase_new = '''        ttTrack("CompletePayment", {\n          value: finalTotal,\n          currency: "EGP",\n          content_ids: purchaseTikTokContentIds,'''
          if tt_purchase_old not in t:
              raise SystemExit('Checkout TikTok CompletePayment block not found')
          t = t.replace(tt_purchase_old, tt_purchase_new, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('src/app/thank-you/page.js')
          t = p.read_text(encoding='utf-8')

          fb_old = '''        // 🔥 نفس getCatalogId المستخدَمة في الكتالوج و ProductView.js —\n        // it.selectedColor محفوظ فعلاً في cartItems الخام (من CartContext)،\n        // فنستخدمه لتوليد نفس g:id الخاص بلون هذا العنصر بالضبط.\n        content_ids: (parsed.cartItems || [])\n          .filter(it => it.handle || it.id)\n          .map(it => getTikTokSkuIdForItem(it)),'''
          fb_new = '''        // Meta Catalog ID — لا يتغير.\n        content_ids: (parsed.cartItems || [])\n          .filter(it => it.handle || it.id)\n          .map(it => getCatalogId(it.handle || it.id, it.selectedColor)),'''
          if fb_old not in t:
              raise SystemExit('Thank-you Meta Purchase block not found')
          t = t.replace(fb_old, fb_new, 1)

          tt_old = '''        content_ids: (parsed.cartItems || [])\n          .filter(it => it.handle || it.id)\n          .map(it => getCatalogId(it.handle || it.id, it.selectedColor)),\n        num_items: (parsed.cartItems || []).reduce((s, it) => s + it.qty, 0),'''
          tt_new = '''        content_ids: (parsed.cartItems || [])\n          .filter(it => it.handle || it.id)\n          .map(it => getTikTokSkuIdForItem(it)),\n        num_items: (parsed.cartItems || []).reduce((s, it) => s + it.qty, 0),'''
          if tt_old not in t:
              raise SystemExit('Thank-you TikTok CompletePayment block not found')
          t = t.replace(tt_old, tt_new, 1)
          p.write_text(t, encoding='utf-8')

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/checkout/page.js src/app/thank-you/page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(tiktok): preserve Meta IDs and use TikTok SKUs [tiktok-event-corrected]"
          git push origin HEAD:fix/tiktok-catalog-variant-schema-matching
