name: One-time TikTok checkout matching patch

on:
  push:
    branches: [fix/tiktok-catalog-variant-schema-matching]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tiktok-checkout-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tiktok-catalog-variant-schema-matching
          fetch-depth: 0

      - name: Patch checkout and purchase IDs
        shell: python
        run: |
          from pathlib import Path

          checkout = Path('src/app/checkout/page.js')
          text = checkout.read_text(encoding='utf-8')
          if 'getTikTokSkuIdForItem' not in text:
              text = text.replace(
                  'import { getCatalogId } from "@/lib/catalogId";\n',
                  'import { getCatalogId } from "@/lib/catalogId";\nimport { getTikTokSkuIdForItem } from "@/lib/tiktokCatalogId";\n',
                  1,
              )
          old = '''      content_ids: cartItems\n        .filter(it => it.handle || it.id)\n        .map(it => getCatalogId(it.handle || it.id, it.selectedColor)),'''
          new = '''      content_ids: cartItems\n        .filter(it => it.handle || it.id)\n        .map(it => getTikTokSkuIdForItem(it)),'''
          if old not in text:
              raise SystemExit('Checkout TikTok content_ids block not found')
          text = text.replace(old, new, 1)
          checkout.write_text(text, encoding='utf-8')

          thank = Path('src/app/thank-you/page.js')
          text = thank.read_text(encoding='utf-8')
          if 'getTikTokSkuIdForItem' not in text:
              text = text.replace(
                  'import { getCatalogId } from "@/lib/catalogId";\n',
                  'import { getCatalogId } from "@/lib/catalogId";\nimport { getTikTokSkuIdForItem } from "@/lib/tiktokCatalogId";\n',
                  1,
              )
          old = '''        content_ids: (parsed.cartItems || [])\n          .filter(it => it.handle || it.id)\n          .map(it => getCatalogId(it.handle || it.id, it.selectedColor)),'''
          new = '''        content_ids: (parsed.cartItems || [])\n          .filter(it => it.handle || it.id)\n          .map(it => getTikTokSkuIdForItem(it)),'''
          if old not in text:
              raise SystemExit('Thank-you TikTok content_ids block not found')
          text = text.replace(old, new, 1)
          thank.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/checkout/page.js src/app/thank-you/page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(tiktok): align checkout and purchase SKU matching [tiktok-checkout-patched]"
          git push origin HEAD:fix/tiktok-catalog-variant-schema-matching
